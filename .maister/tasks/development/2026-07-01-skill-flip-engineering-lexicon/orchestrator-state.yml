      decisions:
        - decision: "Patched spec.md: added 200ms debounce detail, clarified AppShell owns only bottom tab bar (not a shared topbar), clarified progress-stats renders in both Learn and Browse topbars"
          rationale: "Audit found a real, evidence-based fidelity gap against the binding mockup HTML — cheaper to fix at spec stage than after implementation"
      risks:
