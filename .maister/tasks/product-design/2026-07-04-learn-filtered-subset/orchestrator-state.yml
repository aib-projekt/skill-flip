      sections_count: 6
      decisions:
        - {decision: "AppShell is sole owner/mediator of filter state", rationale: "BrowseGrid and LearnMode remain mutually decoupled"}
        - {decision: "Persisted schema excludes searchQuery at the type level", rationale: "No field exists to accidentally serialize"}
        - {decision: "Active-filter indicator is a dismissible topbar chip", rationale: "Reuses existing icon-button/chip visual language"}
        - {decision: "Empty-state extracted into a shared EmptyState component", rationale: "DRY — reused by both BrowseGrid and LearnMode"}
        - {decision: "Progress stats scope to the active filtered subset", rationale: "More meaningful feedback for focused study sessions — new decision made during spec drafting"}
