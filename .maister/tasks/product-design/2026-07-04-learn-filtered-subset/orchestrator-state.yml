task:
  title: "Learn Mode respects Browse's filtered subset"
  description: "learn page use subset did set in browser page, remember filtered subset locally in browser — Learn Mode should draw only from the subset of glossary entries currently filtered in Browse (category/level/search), and that filter selection should be remembered locally in the browser across sessions."
  status: completed
  tags: ["learn-mode", "browse", "filters", "persistence", "enhancement"]
